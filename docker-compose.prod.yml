# UniServe — Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Required: .env.production file in project root
# See: .env.production.example for all variables

# Fixed project name so the production stack (and its postgres_data volume)
# NEVER shares a volume with the dev compose project (same directory default).
name: uniserve-prod

services:
  # ---- Caddy (reverse proxy + HTTPS) ----
  caddy:
    image: caddy:2-alpine
    container_name: uniserve_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infrastructure/caddy/data:/data
      - ./infrastructure/caddy/config:/config
      - ./apps/web/out:/srv:ro
    depends_on:
      api:
        condition: service_healthy

  # ---- FastAPI Backend ----
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: uniserve_api
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env.production
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:16-alpine
    container_name: uniserve_postgres
    restart: unless-stopped
    expose:
      - "5432"
    env_file:
      - .env.production
    environment:
      TZ: Asia/Karachi
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5



  # ---- Redis (optional — not used at runtime) ----
  # Uncomment if you enable Redis-based caching in the future.
  # redis:
  #   image: redis:7-alpine
  #   container_name: uniserve_redis
  #   restart: unless-stopped
  #   expose:
  #     - "6379"
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
  postgres_data:
    driver: local

