name: Publish Samsung login timeout repair APK

on:
  push:
    branches:
      - release/publish-login-coldstart-20261023

permissions:
  contents: write
  actions: read

jobs:
  publish-demo-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APK_BUILD_BRANCH: release/android-login-coldstart-20261022
      RELEASE_TAG: uniserve-android-login-0.1.7-build8-20261023
    steps:
      - name: Select latest native APK build from release branch
        run: |
          APK_BUILD_RUN="$(gh run list --repo "$GH_REPO" --workflow "Build Android APK" --branch "$APK_BUILD_BRANCH" --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$APK_BUILD_RUN"
          echo "APK_BUILD_RUN=$APK_BUILD_RUN" >> "$GITHUB_ENV"
          echo "Using native build run $APK_BUILD_RUN"
      - name: Wait for actual native APK build
        run: gh run watch "$APK_BUILD_RUN" --repo "$GH_REPO" --exit-status --interval 15
      - name: Download actual Android APK (not web bundle)
        run: |
          mkdir -p dist
          gh run download "$APK_BUILD_RUN" --name uniserve-apk --dir dist
          test -s dist/app-release.apk
      - name: Verify APK is a valid Android application archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          p = Path("dist/app-release.apk")
          assert p.stat().st_size > 1_000_000, "APK unexpectedly small"
          with ZipFile(p) as z:
              assert z.testzip() is None, "Corrupt APK ZIP entry"
              files = set(z.namelist())
              assert "AndroidManifest.xml" in files, "Missing Android manifest"
              assert "classes.dex" in files, "Missing Android bytecode"
          print(f"APK validated: {p.stat().st_size:,} bytes")
          PY
          mv dist/app-release.apk dist/UniServe-Android-0.1.7-Build8.apk
          sha256sum dist/UniServe-Android-0.1.7-Build8.apk
      - name: Publish permanent GitHub prerelease download link
        run: |
          gh release create "$RELEASE_TAG" dist/UniServe-Android-0.1.7-Build8.apk \
            --repo "$GH_REPO" \
            --target main \
            --title "UniServe Android 0.1.7 Build 8 — Samsung Login Repair" \
            --notes "Android 0.1.7 build 8 candidate with extended timeout for first login after Render free-tier idle, slow-server progress text, and clearer retry instruction. Built in GitHub Actions run $APK_BUILD_RUN using the real native Expo/Gradle workflow. The production backend origin is https://uniserve-api.onrender.com/api/v1 unless GitHub UNISERVE_API_BASE_URL overrides it. THIS IS NOT VERIFIED ON THE USER'S PHYSICAL SAMSUNG; verify cold login after installation. Does not alter payments or checkout." \
            --prerelease
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json url,assets
