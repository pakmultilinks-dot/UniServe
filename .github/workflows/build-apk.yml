name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - release/android-screenshot-repair-20261022

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # Repository variable can override the fallback production API host.
      # This is a public URL, not an authentication secret.
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.UNISERVE_API_BASE_URL || 'https://uniserve-api.onrender.com/api/v1' }}
    steps:
      - name: Checkout selected workflow revision
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Install dependencies at the monorepo root
        working-directory: .
        run: npm ci --legacy-peer-deps

      - name: Build shared API client
        working-directory: .
        run: npm run build:shared

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Configure Gradle for GitHub runner memory
        run: |
          # Expo prebuild creates the Android Gradle properties. Gradle/KSP
          # exhausted the default JVM Metaspace on the first release build.
          sed -i '/^org.gradle.jvmargs=/d' android/gradle.properties
          # Expo emits gradle.properties without a trailing newline on this runner.
          # Without a separator, the first appended JVM option is concatenated
          # with the preceding expo.inlineModules property, corrupting both.
          printf '\n' >> android/gradle.properties
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=2
          kotlin.compiler.execution.strategy=in-process
          EOF
          tail -n 6 android/gradle.properties
          grep -q '^org.gradle.jvmargs=-Xmx3072m' android/gradle.properties
          ! grep -q 'watchedDirectories=\[\]org.gradle.jvmargs' android/gradle.properties

      - name: Build Release APK
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleRelease --no-daemon --no-parallel --max-workers=2

      - name: Inspect APK output
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uniserve-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
