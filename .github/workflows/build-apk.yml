name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # Repository variable can override the fallback production API host.
      # This is a public URL, not an authentication secret.
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.UNISERVE_API_BASE_URL || 'https://uniserve-api.onrender.com/api/v1' }}
    steps:
      - name: Checkout selected workflow revision
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Install dependencies at the monorepo root
        working-directory: .
        run: npm ci --legacy-peer-deps

      - name: Build shared API client
        working-directory: .
        run: npm run build:shared

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Configure Gradle for GitHub runner memory
        run: |
          sed -i '/^org.gradle.jvmargs=/d' android/gradle.properties
          # Expo may omit the final newline; separate appended properties.
          printf '\n' >> android/gradle.properties
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=2
          kotlin.compiler.execution.strategy=in-process
          EOF
          grep -q '^org.gradle.jvmargs=-Xmx3072m' android/gradle.properties

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --no-parallel --max-workers=2

      - name: Sign and validate final release package
        working-directory: .
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: python3 scripts/sign_verify_android.py

      - name: Preserve public signing, package and source evidence
        uses: actions/upload-artifact@v4
        with:
          name: android-package-verification
          path: artifacts/android-verification/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uniserve-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk

  install-and-live-flow:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      QA_DEMO_PASSWORD: ${{ secrets.QA_DEMO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: uniserve-apk
          path: native-apk
      - name: Enable KVM for disposable Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare isolated staff browser
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Install, launch and test actual signed APK with live staff dashboard
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-metrics -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/android_native_smoke.py
      - name: Preserve real Android and dashboard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-screen-evidence
          path: native-evidence/
