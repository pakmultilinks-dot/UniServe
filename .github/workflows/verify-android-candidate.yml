name: Verify signed Android candidate
on:
  push:
    branches: [fix/android-install-repair-20261023]
    paths: [scripts/android_native_smoke.py, .github/workflows/verify-android-candidate.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      QA_DEMO_PASSWORD: ${{ secrets.QA_DEMO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: uniserve-apk
          path: native-apk
          github-token: ${{ github.token }}
          run-id: 39913081720
      - name: Require exact freshly built privately signed candidate
        run: |
          echo 'ff32e09b7ba1546c6e26a51c3fc26286dd902b10362c43d451426c47d2551ed0  native-apk/app-release.apk' | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare isolated staff browser
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Install and test full student and staff flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-metrics -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/android_native_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-screen-evidence
          path: native-evidence/
